  6 卡。调度时依实际空闲资源排队，不假设资源已预留。最多 48 次物理提交（普通流程 36，含 canary；余量用于故障恢复），4 次 campaign 提交，42
  次 Agent 调用（原预算 48，前次已使用 6），每实验最多 2 次 BugFix。


