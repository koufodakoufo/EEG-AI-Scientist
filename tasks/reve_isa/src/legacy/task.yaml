  # REVE × ISA：基于上一轮证据的调参迭代


  ## 授权与本次范围


  2026-10-18 用户明确要求：“接下来可以以这个为基础。目前这个目标没有达到……接下来可以通过调参的方法来迭代，去再完整地执行一个闭环。”本任务已授权 Codex
  SDK 模型调用、腾讯 TiONE GPU 提交、任务代码补全、独立审查和有界故障修复。无需再次向用户询问是否开始、是否调参或是否接受负结果。


  运行 ID：`reve_isa_hparam_recovery_20261019`。新增且仅新增一个有效科研迭代；Scientist 依据已有训练和 validation
  证据选定一套全数据集共用的参数，完成六目标全量后训练、下游验证、锁定和最终测试，分析后收尾。R0、smoke、失败和修复不计有效迭代。不要扩展为无界网格搜索或额外消融。


  这是整个研究的第二个候选，报告对外称为“调参候选 / H2”；新 run 的控制器局部计数仍是 round=1、round_limit=1，代码中的 R1 标签表示本
  run 的候选，不表示重跑上一轮原参数。保留明确的跨 run 映射。


  ## 已知事实和可用证据


  上一轮实际是官方 REVE-base 的 full encoder + 全 token flatten + L2 normalize + stimulus-paired
  InfoNCE，没有 EA32、pooling 或 projector。已完成六目标、各 40 epochs、72 个候选 validation 单元。验证集的六集等权
  FT 平均较 R0 下降约 0.571 个百分点，2/6 数据集上升；因此本轮有不依赖 test 的改进动机。


  首选阅读以下经过提取、保留来源哈希的验证/训练证据，不要将旧最终 test 表作为调参输入：


  - `/mnt/cfs-omni/wzf/auto research/docs/research/iterations/reve_isa_hparam_recovery_20261019/evidence/previous_validation_summary.json`

  - `/mnt/cfs-omni/wzf/auto research/docs/research/iterations/reve_isa_hparam_20261018/evidence/previous_validation_full.json`

  - `/mnt/cfs-omni/wzf/auto research/docs/research/iterations/reve_isa_hparam_recovery_20261019/evidence/prior_snapshot.json`


  完整 validation 原件 SHA-256：`e2e5bfe06eb43ac650711ea9b8a7395d9e4f31fbbb8b0a7b5e3f74dc721b5f1d`。摘要没有替代原件的权威性。原件
  test_evaluations=0；参数选择应引用该原件或其有来源的摘要。


  沿用已经真实完成实验的源码快照，勿退回旧 example 包：


  `/mnt/cfs-omni/wzf/auto research/logs/research_controller/reve_isa_hparam_20261018/runs/reve_isa_hparam_20261018/bootstrap/review_4/source`


  本次接入包快照 hash：`cd04eb945e0b77b0a1cc13ad0b29048101268b90c4da697e93b424ab93cff14c`。先复制为本
  run 的 bootstrap workspace，再进行必要接入改动；保持原快照和旧 run 不变。数据路径、release 身份、官方权重和被试 split
  从该包的 data_contract.py、release_reference.json、official_model.py、split_manifest.json核验，不猜测重建。


  历史 test 结果此前已经展示给用户，本轮属于同一历史划分上的探索性后续研究。即使本轮只用 validation 选参数，也不能声称获得了从未被查看过的独立确认性
  test。


  ## 固定项与调参范围


  固定六个 target：SEED、SEEDIV、SEED_V、SEED_VII、FACED、DEAP。各 target 留出，其他五个 source 的 all-sample
  参与后训练；每个 target 从同一官方权重独立初始化，不能从上一轮 ISA checkpoint 继续训练冒充纯调参比较。


  保留 200 Hz、10 秒、60ch、NoClip/no-zscore、SEED session-fix、历史六个被试划分 seeds 42–47，原标签与预处理。固定
  REVE 全 token flatten/L2、同刺激跨被试配对 InfoNCE、full encoder、batch64/source、每 anchor 62
  个负样本、五个 source 的独立损失等权平均、40 epochs 和最后 epoch 后训练 checkpoint。不加入 EA32、投影头、情绪标签 SupCon、跨
  source 负样本或附加 loss。


  允许参数范围沿用此前契约：


  | 参数 | 上一轮实际值 | 本轮允许范围 |

  |---|---:|---:|

  | posttrain_lr | 1e-5 | 1e-6 ～ 2e-4 |

  | temperature | 0.1 | 0.03 ～ 0.3 |

  | posttrain_weight_decay | 1e-4 | 0 ～ 1e-2 |

  | warmup_epochs | 3 | 整数 0 ～ 8 |

  | gradient_clip | 1.0 | 0.5 ～ 5.0 |


  由 Scientist 比较少量候选参数思路，依据 validation 与 loss/梯度记录选定一套共同参数；至少实质改变一个参数，优先只改变一至两个有依据的参数，未改参数仍完整填写。不能无证据断言下降由某个超参导致；将解释写为待检验假设。此次只执行一个共同候选，不按数据集分别调参，不追加
  sweep，不将吞吐 smoke 的 loss 当作选参成绩。


  下游 LP/FT 结构、优化器、学习率、训练上限、early stop、checkpoint selection、指标与六次划分完全沿用已核验协议：LP 冻结
  encoder + train-only 特征标准化 + Linear；FT full encoder + LayerNorm/256/128 MLP。不得通过调整下游头或减少
  epochs/folds 来制造本轮提升。


  ## 工程接入要求


  Bootstrap Engineer 复用完整已修复包；仅作新 run 绑定、调参授权及证据传递所需修改。Reviewer 应逐项确认：


  1. configure_launch.py 配置新 run、1 个有效轮次、新 brief、截止时间和提交预算后，检查它是否重新写入旧“faithful R1
  / temperature 必须 0.1 / 旧目标”文本。按本 brief 同步更新 task.yaml、readiness、protocol、candidate_plan
  和相应校验，不能出现新任务允许调参但 stages.check_r1 仍禁止温度变化的矛盾。

  2. 一轮接入后的候选需要引用上述真实历史 validation hash，写清旧参数、新参数、假设和结果相反时的解释。Scientist 负责最终参数决策；Bootstrap
  不把未决定的超参写成已经跑过。

  3. 参数约束可保留原参数接口；新增的研究代码可编辑范围尽量限于 candidate_plan.json，纯调参不修改 ISA 表示、采样或 loss。工程故障仍由
  BugFix → Reviewer → Executor 处理。

  4. 使用本 run 新的 artifacts 输出。默认重建本 run 的 R0，保持与当前包的评估身份一致；不要用旧 JSON 伪造本 run 已完成 baseline。复用原始数据和只读官方权重；不要重新预处理数据。避免为复用跨
  run checkpoint 额外设计复杂接入而延误这一轮。

  5. 把 previous_validation_summary.json 和原始 validation 来源 hash 纳入任务包。最终报告增加与上一轮 ISA
  的逐集 LP/FT validation 差值、等权均值和提升数；这个派生比较不覆盖原始分数。旧完整 test 报告不进入方法选择。

  6. 最终报告将科学结果与运行情况分开。尽量从本 run receipts/epochs/telemetry 输出任务 ID、失败及恢复、资源与耗时摘要，以可读引用保留明细。不能因为未证明“整个
  Harness 永远可靠”或缺少额外机制消融，否认已经完成的有效负结果、卡住收尾或要求用户再次批准。

  7. 在真实 GPU 提交前完成现有 CPU 包校验、源码审查和正式路径数值/吞吐 canary；不能重复运行已足够的检查而不提交任务。继承 source_parallel.py
  的 BF16 线程修复和现有 RAM staging/审计修复。


  ## 闭环与验收


  固定流程：需求/历史 validation → Scientist 参数假设 → Engineer 必要接入与候选计划 → Reviewer/可信校验 → Executor
  资源和 ETA 检查 → TiONE canary 与全量任务 → 72 单元候选 validation → 锁定共同方案 → R0 与新候选共 144 个 test
  单元 → Scientist 结果解释 → 有限 Reviewer 收尾。


  一轮流程完成标准：上述实际证据全部产生，给出逐集 R0/新候选对照和上一轮 ISA validation 对照，记录正负结果及下一步建议。无需本会话持续等待或手工触发分析。完成后停止，不自动开展第三个候选。


  性能判断分三层，不能混用：


  - 相对上一轮的进步：共同候选六集等权 FT validation 均值高于上一轮 ISA，并列出 LP 与逐集变化。

  - 相对原始 REVE 的整体收益：锁定候选的六集等权 FT test 差值为正；同时报告有多少数据集为正。

  - 原研究最终目标：六个数据集 FT test 差值全部为正。只恢复均值或只改善 FACED 不代表此目标达成。


  以上均为描述性指标；不要求为了宣称显著性额外做消融。若调参仍下降，报告有效负结果，明确性能目标未达到；require_user_confirmation=false。失败作业、smoke、审查和历史结果引用都不能计为新增科研轮次。


  ## 部署、资源与持续运行


  运行代码：`/mnt/cfs-omni/wzf/auto research/releases/harness-recovery-20261017`，已含报告上下文归档修复；继续
  codex_python、gpt-6.1-sol/xhigh、user_current，不换账号/后端。


  可信新配置：


