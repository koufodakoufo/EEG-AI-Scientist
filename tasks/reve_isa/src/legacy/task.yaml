  小时，本次恢复部署硬上限 12 小时（包含工程准备与排队，使用新 broker 的实际 deadline）。Bootstrap 将 broker_contract.MAX_WORKER_SECONDS
  及请求/任务说明统一为 43200；保留既有超过 12 小时先排查工程/策略的准入检查，不让 86400 秒旧默认值与新 broker 冲突。预计超过 24 小时必须重新检查
  BF16、数据等待、并行及实验策略，不能直接放大超时。保持科学预算不缩水。


  开启持久 Supervisor、TiONE Broker、Keeper，以及 900 秒 Inspector。已确认失败由 BugFix 修复、Reviewer
