[project]
name = "eeg-ai-scientist"
version = "0.1.0"
description = "A traceable EEG-style hypothesis-diagnosis loop with a sealed-prediction controller."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
eeg-scientist = "eeg_scientist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eeg_scientist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
